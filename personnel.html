<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /*  โทนสีใหม่  */
        :root {
            --primary-pink: #d81b60;
            --light-pink: #fce4ec;
            --accent-pink: #f06292;
            --bg-pink: #fff5f8;
            --gray-text: #555;
            --light-gray: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background-color: var(--bg-pink); color: #333; line-height: 1.6; font-size: 16px; }
        .container { max-width: 1320px; margin: 0 auto; padding: 0 20px; }
        
        /* ================== Header ================== */
        header { background: #fff; box-shadow: 0 2px 15px rgba(216, 27, 96, 0.08); position: sticky; top: 0; z-index: 100; }
        .header-main { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; flex-wrap: wrap; gap: 15px; }
        .logo { display: flex; align-items: center; gap: 15px; font-size: 26px; font-weight: 700; color: var(--primary-pink); text-decoration: none; }
        nav ul { list-style: none; display: flex; gap: 20px; align-items: center; }
        nav a { text-decoration: none; color: #333; font-weight: 500; font-size: 17px; cursor: pointer; transition: 0.3s; padding: 10px 15px; border-radius: 6px; }
        nav a:hover { color: var(--primary-pink); background: var(--light-pink); }
        .btn-home { background: var(--light-pink); color: var(--primary-pink); font-weight: 600; border: 1px solid var(--primary-pink); }

        /* ================== ส่วนเนื้อหาหลัก ================== */
        .page-header { text-align: center; padding: 40px 0 30px; }
        .page-header h1 { font-size: 32px; color: var(--primary-pink); margin-bottom: 5px; }
        .page-header p { color: var(--gray-text); font-size: 16px; }

        .personnel-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            padding-bottom: 80px;
            align-items: start;
        }

        /* ================== เมนูด้านซ้าย (Sidebar) ================== */
        .sidebar { background: #fff; border-radius: 15px; padding: 20px 15px; box-shadow: 0 5px 20px rgba(216, 27, 96, 0.05); border: 1px solid var(--light-pink); position: sticky; top: 100px; max-height: calc(100vh - 120px); overflow-y: auto; }
        
        /* สไตล์ Scrollbar ของเมนูซ้าย */
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: #f8bbd0; border-radius: 10px; }
        
        .sidebar h3 { font-size: 18px; color: var(--primary-pink); margin-bottom: 15px; border-bottom: 2px solid var(--light-pink); padding-bottom: 10px; padding-left: 5px; }
        .sidebar ul { list-style: none; }
        .sidebar li { margin-bottom: 5px; }
        
        /* หมวดหมู่หลัก */
        .menu-group { font-size: 14px; font-weight: 700; color: #888; margin: 15px 0 5px 10px; }

        .sidebar button {
            width: 100%; text-align: left; background: none; border: none; padding: 10px 15px; border-radius: 8px; font-size: 15px; color: #444; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar button i { font-size: 12px; color: #ccc; transition: 0.2s; }
        .sidebar button:hover { background: var(--bg-pink); color: var(--primary-pink); }
        .sidebar button.active { background: var(--primary-pink); color: #fff; font-weight: 500; box-shadow: 0 4px 10px rgba(216, 27, 96, 0.2); }
        .sidebar button.active i { color: #fff; transform: translateX(3px); }

        /* ปุ่มเมนูย่อยให้ขยับเข้าไปนิดนึง */
        .sidebar button.sub-item { padding-left: 25px; font-size: 14px; border-left: 3px solid transparent; border-radius: 0 8px 8px 0; }
        .sidebar button.sub-item:hover { border-left-color: var(--accent-pink); }
        .sidebar button.sub-item.active { border-left-color: #fff; }

        /* ================== พื้นที่โหลด iFrame ด้านขวา ================== */
        .content-area { background: #fff; border-radius: 15px; box-shadow: 0 5px 20px rgba(216, 27, 96, 0.05); border: 1px solid var(--light-pink); min-height: 800px; overflow: hidden; display: flex; flex-direction: column; }
        .iframe-container { flex: 1; width: 100%; border: none; min-height: 800px; }

        /* Footer */
        footer { background: #3c1020; color: #fce4ec; padding: 30px 0; text-align: center; font-size: 14px; margin-top: auto; }

        /* ================== Responsive (มือถือ) ================== */
        @media (max-width: 900px) {
            .personnel-layout { grid-template-columns: 1fr; gap: 20px; }
            /* เปลี่ยนเมนูซ้ายเป็นแถบเลื่อนแนวนอนบนมือถือ */
            .sidebar { position: relative; top: 0; max-height: unset; padding: 15px; overflow-x: auto; white-space: nowrap; }
            .sidebar ul { display: inline-flex; gap: 8px; }
            .menu-group { display: none; } /* ซ่อนหัวข้อหมวดหมู่ในมือถือให้ประหยัดที่ */
            .sidebar li { margin-bottom: 0; }
            .sidebar button, .sidebar button.sub-item { padding: 10px 15px; border: 1px solid #eee; border-radius: 20px; white-space: nowrap; font-size: 14px; }
            .sidebar button i { display: none; }
            .content-area { min-height: 600px; }
            .iframe-container { min-height: 600px; }
        }
    </style>
</head>

    <script>
        function loadDep(url, btnElement) {
            // 1. ลบไฮไลท์สีชมพูออกจากปุ่มเก่าทั้งหมด
            var btns = document.getElementsByClassName("tab-btn");
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove("active");
            }
            
            // 2. ไฮไลท์ปุ่มที่เพิ่งกด
            btnElement.classList.add("active");
            
            // 3. สั่งให้ iFrame โหลดหน้าเว็บใหม่ตาม URL ที่กำหนด
            document.getElementById("cwindow").src = url;

            // สำหรับมือถือ: เลื่อนหน้าจอกลับขึ้นไปด้านบนตรง iFrame เพื่อให้เห็นเนื้อหาใหม่ทันที
            if (window.innerWidth <= 900) {
                document.querySelector('.content-area').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // ฟังก์ชันปรับความสูง iFrame อัตโนมัติตามเนื้อหาด้านใน (สคริปต์เดิมของคุณนำมาปรับปรุง)
        function autoResize(iframe) {
            try {
                // พยายามอ่านความสูงของเนื้อหาด้านใน (จะทำได้ก็ต่อเมื่ออยู่ในโดเมนเดียวกัน)
                var newHeight = iframe.contentWindow.document.body.scrollHeight;
                if (newHeight > 800) {
                    iframe.style.height = (newHeight + 50) + "px";
                } else {
                    iframe.style.height = "800px"; // ความสูงขั้นต่ำ
                }
            } catch(e) {
                // หากติดปัญหา Cross-origin ให้ใช้ความสูงขั้นต่ำ
                iframe.style.height = "800px";
            }
        }
    </script>
