<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บุคลากรในหน่วยงาน - โรงพยาบาลปากท่อ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* โทนสีใหม่ */
        :root {
            --primary-pink: #d81b60;
            --light-pink: #fce4ec;
            --accent-pink: #f06292;
            --bg-pink: #fff5f8;
            --gray-text: #555;
            --light-gray: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-pink); color: #333; line-height: 1.6; font-size: 16px; }
        .container { max-width: 1320px; margin: 0 auto; padding: 0 20px; } 

        /* Header */
        header { background: #fff; box-shadow: 0 2px 15px rgba(216, 27, 96, 0.08); position: sticky; top: 0; z-index: 100; }
        .header-main { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; flex-wrap: wrap; gap: 15px; }
        .logo { display: flex; align-items: center; gap: 15px; font-size: 26px; font-weight: 700; color: var(--primary-pink); text-decoration: none; }
        nav ul { list-style: none; display: flex; gap: 20px; align-items: center; }
        nav a { text-decoration: none; color: #333; font-weight: 500; font-size: 17px; cursor: pointer; transition: 0.3s; padding: 10px 15px; border-radius: 6px; white-space: nowrap; }
        nav a:hover { color: var(--primary-pink); background: var(--light-pink); }
        .btn-home { background: var(--light-pink); color: var(--primary-pink); font-weight: 600; border: 1px solid var(--primary-pink); }

        /* ส่วนหัวของเพจ */
        .page-header { text-align: center; padding: 40px 0 30px; }
        .page-header h1 { font-size: 32px; color: var(--primary-pink); margin-bottom: 5px; }
        .page-header p { color: var(--gray-text); font-size: 16px; }

        /* โครงสร้างหลัก (ซ้าย-ขวา) */
        .personnel-layout {
            display: grid;
            /* 🌟 ขยายความกว้างเมนูด้านซ้ายจาก 320 เป็น 350 ป้องกันตัวหนังสือตกบรรทัด */
            grid-template-columns: 350px 1fr; 
            gap: 30px;
            padding-bottom: 80px;
            align-items: start;
        }

        /* ------------------ เมนูด้านซ้าย (Sidebar) ------------------ */
        .sidebar { background: #fff; border-radius: 15px; padding: 20px 15px; box-shadow: 0 5px 20px rgba(216, 27, 96, 0.05); border: 1px solid var(--light-pink); position: sticky; top: 100px; max-height: calc(100vh - 120px); overflow-y: auto; }
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: #f8bbd0; border-radius: 10px; }
        .sidebar h3 { font-size: 18px; color: var(--primary-pink); margin-bottom: 10px; border-bottom: 2px solid var(--light-pink); padding-bottom: 10px; padding-left: 5px; }
        
        .menu-list { list-style: none; }
        
        /* 🌟 ป้ายกำกับ Dropdown (แก้ไขการขึ้นบรรทัดใหม่) */
        .menu-label {
            width: 100%; text-align: left; background: transparent; border: none;
            font-size: 14px; font-weight: 700; color: #a18892; text-transform: uppercase; 
            letter-spacing: 0; margin: 10px 0 5px 0; padding: 10px 15px; display: flex; 
            align-items: flex-start; /* จัดไอคอนให้ชิดขอบบนเสมอเมื่อตัวหนังสือตกบรรทัด */
            justify-content: space-between; cursor: pointer; 
            border-radius: 8px; transition: 0.2s;
            line-height: 1.4; /* เพิ่มระยะห่างบรรทัดให้อ่านง่าย */
        }
        .menu-label:hover { background: var(--bg-pink); color: var(--primary-pink); }
        .menu-label .label-text { display: flex; align-items: flex-start; gap: 8px; text-align: left; word-break: keep-all; }
        .menu-label .label-text i { color: var(--accent-pink); font-size: 16px; margin-top: 2px; } /* ดันไอคอนให้ตรงบรรทัดแรก */
        .menu-label .caret { color: #ccc; font-size: 12px; transition: transform 0.3s ease; margin-top: 5px; }
        .menu-label.open { color: var(--primary-pink); background: var(--bg-pink); }
        .menu-label.open .caret { transform: rotate(180deg); color: var(--primary-pink); }

        /* เมนูย่อยแบบ Dropdown */
        .submenu { display: none; list-style: none; padding-left: 0; margin-bottom: 10px; animation: slideDown 0.3s ease-out; }
        .submenu.show { display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* ปุ่มเมนูทั่วไป */
        .tab-btn {
            width: 100%; text-align: left; background: transparent; border: none; padding: 10px 15px; border-radius: 8px; font-size: 15px; color: #444; cursor: pointer; transition: 0.2s; display: flex; align-items: flex-start; gap: 10px; margin-bottom: 2px; line-height: 1.4;
        }
        .tab-btn:hover { background: var(--bg-pink); color: var(--primary-pink); }
        .tab-btn.active { background: var(--primary-pink); color: #fff; font-weight: 500; box-shadow: 0 4px 10px rgba(216, 27, 96, 0.2); }
        .tab-btn i { margin-top: 3px; }
        
        /* สไตล์ของปุ่มเมนูหมวดหมู่หลัก */
        .tab-btn.tab-category {
            font-size: 14px; font-weight: 700; color: #a18892; text-transform: uppercase; 
            letter-spacing: 0; margin: 10px 0 5px 0; gap: 8px;
        }
        .tab-btn.tab-category i { color: var(--accent-pink); font-size: 16px; margin-top: 2px; }
        .tab-btn.tab-category:hover { color: var(--primary-pink); background: var(--bg-pink); }
        .tab-btn.tab-category.active { color: #fff; background: var(--primary-pink); box-shadow: 0 4px 10px rgba(216, 27, 96, 0.2); }
        .tab-btn.tab-category.active i { color: #fff; }

        /* ปุ่มเมนูย่อย */
        .tab-btn.sub-item {
            font-size: 14px; padding: 8px 15px 8px 35px; border-radius: 8px; background: transparent; position: relative; color: #666;
        }
        .tab-btn.sub-item::before {
            content: ''; position: absolute; left: 18px; top: 14px; transform: translateY(-50%); width: 6px; height: 6px; border-radius: 50%; background-color: #ddd; transition: 0.3s;
        }
        .tab-btn.sub-item:hover::before { background-color: var(--primary-pink); }
        .tab-btn.sub-item.active { background: var(--light-pink); color: var(--primary-pink); font-weight: 600; box-shadow: none; }
        .tab-btn.sub-item.active::before { background-color: var(--primary-pink); }

        /* ------------------ พื้นที่แสดงผลขวามือ ------------------ */
        .content-area { 
            background: #fff; border-radius: 15px; box-shadow: 0 5px 20px rgba(216, 27, 96, 0.05); 
            border: 1px solid var(--light-pink); min-height: 600px; 
            overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 20px; 
            position: relative;
        }
        
        /* คลุมรูปภาพเพื่อใส่ลูกเล่นคลิกซูม */
        .img-wrapper {
            position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: zoom-in; z-index: 2;
        }
        .img-container { 
            max-width: 100%; max-height: 100%; width: auto; height: auto; 
            object-fit: contain; border-radius: 8px; transition: opacity 0.4s ease-in-out; 
        }
        
        /* ป้ายแจ้งเตือนให้กดซูม */
        .zoom-hint { 
            position: absolute; bottom: 20px; right: 20px; background: rgba(216, 27, 96, 0.9); color: white; padding: 10px 20px; border-radius: 30px; font-size: 14px; opacity: 0; transition: 0.3s; pointer-events: none; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        }
        .img-wrapper:hover .zoom-hint { opacity: 1; transform: scale(1.05); }

        /* Fallback Placeholder */
        .no-image-placeholder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: var(--light-gray); color: var(--primary-pink);
            border-radius: 15px; z-index: 1; 
        }
        .no-image-placeholder i { font-size: 60px; margin-bottom: 15px; opacity: 0.5; }
        .no-image-placeholder h3 { font-size: 24px; margin-bottom: 5px; opacity: 0.8; }
        .no-image-placeholder p { font-size: 16px; color: #888; }

        /* ระบบ Popup Modal สำหรับซูมรูปภาพ (ปรับขนาดให้ใหญ่พอดีจอที่สุด) */
        .image-modal { display: none; position: fixed; z-index: 99999; left: 0; top: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .modal-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .modal-content { 
            max-width: 98vw; /* ขยายความกว้างเกือบชิดขอบจอ */
            max-height: 98vh; /* ขยายความสูงเกือบชิดขอบจอ */
            width: auto; 
            height: auto; 
            object-fit: contain; /* รักษาสัดส่วนภาพให้อยู่ในกรอบพอดี */
            border-radius: 8px; 
            box-shadow: 0 5px 25px rgba(0,0,0,0.8); 
            cursor: zoom-out; 
        }
        .close-modal { 
            position: absolute; top: 15px; right: 25px; color: #fff; font-size: 45px; font-weight: bold; 
            cursor: pointer; transition: 0.3s; z-index: 100000; text-shadow: 0 2px 10px rgba(0,0,0,0.8); 
        }
        .close-modal:hover { color: var(--accent-pink); transform: scale(1.1); }
        /* Footer */
        footer { background: #3c1020; color: #fce4ec; padding: 30px 0; text-align: center; font-size: 14px; margin-top: auto; }

        /* Responsive (มือถือ) */
        @media (max-width: 900px) {
            .personnel-layout { grid-template-columns: 1fr; gap: 20px; }
            .sidebar { position: relative; top: 0; max-height: unset; padding: 15px; }
            .content-area { min-height: 400px; padding: 10px; }
            .zoom-hint { opacity: 1; bottom: 10px; right: 10px; font-size: 12px; padding: 6px 12px; } 
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-main">
            <a href="index.html" class="logo">
                <img src="Picture/logo.png" alt="โลโก้โรงพยาบาล" style="height: 55px; width: auto; margin-right: 10px;" onerror="this.style.display='none'">
                โรงพยาบาลปากท่อ

            <nav>
                <ul>
                    <li><a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> กลับหน้าแรก</a></li>

    <div class="container page-header">

        <aside class="sidebar">

                <ul class="submenu" id="menu-admin">
                    <li><button class="tab-btn sub-item" onclick="loadDep('Picture/Personnel/Manage_group/admin_dep.png', this)">งานบริหารทั่วไป</button></li>
                    <li><button class="tab-btn sub-item" onclick="loadDep('Picture/Personnel/Manage_group/parcel.png', this)">งานพัสดุ</button></li>
                    <li><button class="tab-btn sub-item" onclick="loadDep('Picture/Personnel/Manage_group/finance_dep.png', this)">งานการเงิน</button></li>

        <main class="content-area">
            <div id="placeholder-box" class="no-image-placeholder">
                <i class="fa-solid fa-image"></i>

    <!-- โครงสร้าง Modal สำหรับซูมภาพเต็มจอ -->

    <!-- Script -->
    <script>
        // จัดการเปิด-ปิด Dropdown Menu
        function toggleDropdown(menuId) {
            const submenu = document.getElementById(menuId);
            const labelBtn = submenu.previousElementSibling;
            
            submenu.classList.toggle('show');
            labelBtn.classList.toggle('open');
        }

        // ฟังก์ชันเปลี่ยนรูปภาพ
        function loadDep(url, btnElement) {
            var btns = document.getElementsByClassName("tab-btn");
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove("active");
            }
            btnElement.classList.add("active");
            
            const imgViewer = document.getElementById("cwindow");
            const placeholderBox = document.getElementById("placeholder-box");
            const imgWrapper = document.getElementById("imgWrapper");
            
            imgViewer.style.opacity = '0'; 
            
            setTimeout(() => {
                imgViewer.style.display = 'block'; 
                imgWrapper.style.display = 'none'; // ซ่อนปุ่มซูมชั่วคราว
                placeholderBox.style.display = 'flex'; 
                imgViewer.src = url; 
            }, 200);

            if (window.innerWidth <= 900) {
                setTimeout(() => {
                    document.querySelector('.content-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
        }

        // ฟังก์ชันระบบซูมภาพ (Lightbox)
        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            if (document.getElementById('cwindow').style.display !== 'none') {
                modal.style.display = "flex"; 
                modalImg.src = imgSrc;
            }
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = "none";
        }
    </script>
</body>
