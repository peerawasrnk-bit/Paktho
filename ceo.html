<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คณะกรรมการบริหาร - โรงพยาบาลปากท่อ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-pink: #D81B60;
            --accent-pink: #F06292;
            --light-pink: #FCE4EC;
            --bg-pink: #FFF5F8;
            --gray-text: #555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background-color: var(--bg-pink); color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; } 

        /* Header */
        header { background: #fff; box-shadow: 0 2px 15px rgba(216, 27, 96, 0.08); position: sticky; top: 0; z-index: 100; }
        .header-main { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        .logo { display: flex; align-items: center; gap: 15px; font-size: 24px; font-weight: 700; color: var(--primary-pink); text-decoration: none; }
        .btn-home { background: var(--light-pink); color: var(--primary-pink); font-weight: 600; text-decoration: none; padding: 10px 15px; border-radius: 6px; transition: 0.3s; }
        .btn-home:hover { background: var(--primary-pink); color: #fff; }

        /* Page Header */
        .page-header { text-align: center; padding: 40px 0 30px; }
        .page-header h1 { font-size: 32px; color: var(--primary-pink); margin-bottom: 5px; }
        .page-header p { color: var(--gray-text); font-size: 16px; }

        /* กล่องแสดงรูปแผนผัง */
        .ceo-card { 
            background: #fff; border-radius: 15px; padding: 30px; 
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.08); border: 1px solid var(--light-pink); 
            margin-bottom: 60px; display: flex; flex-direction: column; align-items: center; 
        }

        /* ห่อหุ้มรูปภาพเพื่อใส่ลูกเล่น Zoom */
        .img-wrapper {
            position: relative; width: 100%; border-radius: 10px; overflow: hidden;
            display: flex; justify-content: center; cursor: zoom-in;
            background: #fafafa; border: 1px dashed #ddd; padding: 10px;
            transition: 0.3s;
        }
        .img-wrapper:hover { border-color: var(--accent-pink); box-shadow: 0 5px 20px rgba(216, 27, 96, 0.1); }
        
        .ceo-img { max-width: 100%; height: auto; border-radius: 8px; transition: 0.4s ease; }
        .img-wrapper:hover .ceo-img { transform: scale(1.02); }

        .zoom-hint { 
            position: absolute; bottom: 20px; right: 20px; background: rgba(216, 27, 96, 0.9); 
            color: white; padding: 10px 20px; border-radius: 30px; font-size: 14px; 
            opacity: 0; transition: 0.3s; pointer-events: none; display: flex; align-items: center; gap: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        }
        .img-wrapper:hover .zoom-hint { opacity: 1; transform: scale(1.05); }

        /* ระบบ Popup Modal สำหรับซูมรูปภาพ */
        .image-modal { display: none; position: fixed; z-index: 99999; left: 0; top: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .modal-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .modal-content { max-width: 98vw; max-height: 98vh; width: auto; height: auto; object-fit: contain; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.8); cursor: zoom-out; }
        .close-modal { position: absolute; top: 15px; right: 25px; color: #fff; font-size: 45px; font-weight: bold; cursor: pointer; transition: 0.3s; z-index: 100000; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .close-modal:hover { color: var(--accent-pink); transform: scale(1.1); }

        footer { background: #3c1020; color: #fce4ec; padding: 30px 0; text-align: center; margin-top: auto; font-size: 14px; }

        @media (max-width: 900px) {
            .header-main { flex-direction: column; gap: 15px; }
            .ceo-card { padding: 15px; }
            .zoom-hint { opacity: 1; bottom: 10px; right: 10px; font-size: 12px; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-main">
            <a href="index.html" class="logo">
                <!-- ตรวจสอบโฟลเดอร์ Picture ให้แน่ใจว่าลิงก์โลโก้ถูกต้อง -->
                <img src="Picture/logo.png" alt="โลโก้โรงพยาบาล" style="height: 50px;" onerror="this.style.display='none'">
                โรงพยาบาลปากท่อ
            </a>
            <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> กลับหน้าแรก</a>
        </div>
    </header>

    <div class="container page-header">
        <h1><i class="fa-solid fa-users-viewfinder"></i> คณะกรรมการบริหารโรงพยาบาล</h1>
        <p>ทำเนียบผู้บริหาร และหัวหน้ากลุ่มงาน โรงพยาบาลปากท่อ</p>
    </div>

    <div class="container">
        <div class="ceo-card">
            
            <div class="img-wrapper" onclick="openModal('Picture/Personnel/Supervisor.png')">
                <!-- แก้ไขลิงก์รูปภาพให้ตรงกับที่อยู่ไฟล์จริงในเซิร์ฟเวอร์ของคุณ -->
                <img src="Picture/Personnel/Supervisor.png" class="ceo-img" alt="คณะกรรมการบริหารโรงพยาบาลปากท่อ" onerror="this.src='https://placehold.co/1200x800/fce4ec/d81b60?text=กำลังปรับปรุงข้อมูลภาพคณะกรรมการบริหาร'">
                
                <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> คลิกเพื่อขยายภาพ</div>
            </div>

        </div>
    </div>

    <!-- โครงสร้างหน้าต่าง Popup ซูมภาพ (Lightbox) -->
    <div id="imageModal" class="image-modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <div class="modal-wrapper">
            <img class="modal-content" id="modalImg" onclick="event.stopPropagation();">
        </div>
    </div>

    <footer>
        <div class="container">
            <p>โรงพยาบาลปากท่อ เลขที่ 201/10 หมู่ 8 ถ.ท้าวอู่ทอง ต.ปากท่อ อ.ปากท่อ จ.ราชบุรี 70140</p>
            <p style="color: #f8bbd0; margin-top: 5px;">Copyright 2026 by Paktho Computer Center.</p>
        </div>
    </footer>

    <script>
        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = "flex"; 
            modalImg.src = imgSrc;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = "none";
        }
    </script>
</body>
</html>
